name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Test Codex plugin collector
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build macOS menu-bar app
        run: |
          chmod +x macos/TokenUsageMonitor/scripts/build_app.sh
          macos/TokenUsageMonitor/scripts/build_app.sh
      - name: Package app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          'macos/TokenUsageMonitor/dist/Token Usage Monitor.app'
          'Token-Usage-Monitor-macOS-arm64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Token-Usage-Monitor-macOS-arm64
          path: Token-Usage-Monitor-macOS-arm64.zip

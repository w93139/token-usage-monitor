name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run usage and API tests
        run: python3 -m unittest discover -s scripts/tests -v

  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release application
        run: macos/TokenUsageMonitor/scripts/build_app.sh
      - name: Verify application signature
        run: codesign --verify --deep --strict "macos/TokenUsageMonitor/dist/Token监测.app"
